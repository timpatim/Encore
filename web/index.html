<style>
:root {
    --bg: #15171c; --panel: #1d2027; --panel2: #252932; --line: #333845; --text: #e4e6eb; --muted: #969cab;
    --accent: #6aa7ff; --err: #ff6b6b; --warn: #f0b44c; --ok: #5fc98a; --field: #12141a;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: #2c4f86; border-color: #3d68ad; }
button.danger:hover { border-color: var(--err); color: var(--err); }
button.small { padding: 1px 6px; font-size: 12px; }
input, select, textarea { background: var(--field); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { width: 100%; resize: vertical; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
label { color: var(--muted); font-size: 12px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.app { display: flex; flex-direction: column; height: 100%; }
.app > .body { flex: 1; }
.viewtabs { display: flex; gap: 2px; margin-right: 10px; }
.viewtabs button { border-radius: 5px; }
.viewtabs button.on { background: #2c4f86; border-color: #3d68ad; }
header { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
header .title { font-weight: 600; margin-right: 6px; }
.studio-app { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: #101216; border-bottom: 1px solid var(--line); }
.studio-app .spacer { flex: 1; }
.studio-app-title { font-weight: 700; font-size: 17px; letter-spacing: .02em; margin-right: 10px; display: inline-flex; align-items: center; gap: 9px; }
.studio-logo { display: inline-flex; }
.studio-home-title { display: flex; align-items: center; gap: 12px; }
.studio-logo { display: inline-block; filter: drop-shadow(0 0 6px #2f8cff55); }
header.studio-project-row { background: var(--panel); }
.studio-project-label { color: var(--muted); margin-right: 4px; white-space: nowrap; }
.studio-project-label b { color: var(--fg, #e8ecf4); font-size: 14px; }
header .file { color: var(--muted); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .dirty { color: var(--warn); }
header .spacer { flex: 1; }
.badge { padding: 2px 9px; border-radius: 10px; font-size: 12px; cursor: pointer; border: 1px solid transparent; }
.badge.ok { background: #1f3a2b; color: var(--ok); }
.badge.err { background: #4a2326; color: var(--err); }
.badge.warn { background: #45371c; color: var(--warn); }
.menu { position: relative; }
.menu .items { display: none; position: absolute; top: 100%; left: 0; z-index: 20; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px; min-width: 210px; }
.menu.open .items { display: block; }
.menu .items button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; }
.menu .items button:hover { background: #2f3542; }

/* timeline */
.timeline { background: var(--panel); border-bottom: 1px solid var(--line); padding: 6px 12px 8px; }
.tl-head { display: flex; gap: 14px; align-items: baseline; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.tl-head b { color: var(--text); font-weight: 600; }
.tl-wrap { position: relative; overflow-x: auto; overflow-y: hidden; }
.tl { position: relative; height: 74px; min-width: 100%; }
.tl .ruler { position: absolute; left: 0; right: 0; top: 0; height: 16px; border-bottom: 1px solid var(--line); }
.tl .tick { position: absolute; top: 0; height: 16px; border-left: 1px solid var(--line); font-size: 10px; color: var(--muted); padding-left: 3px; }
.tl .block { position: absolute; top: 20px; height: 32px; border-radius: 4px; padding: 2px 6px; font-size: 11px; overflow: hidden; white-space: nowrap; cursor: pointer; border: 1px solid rgba(255,255,255,.12); color: #fff; }
.tl .block .n { font-weight: 700; margin-right: 4px; }
.tl .block .d { opacity: .75; }
.tl .block.sel { outline: 2px solid #fff; outline-offset: 1px; z-index: 3; }
.tl .block.startvid { background: #4a5260; }
.tl .block.startvid.out { background: repeating-linear-gradient(135deg, #4a5260 0 6px, #343a44 6px 12px); opacity: .8; }
.start-video .sv-player { width: 100%; max-height: 260px; margin: 6px 0; background: #000; border-radius: 4px; }
.start-video .sv-range { flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.start-video .sv-info { margin: 4px 0 8px; }
.start-video label.tk-inline { display: flex; gap: 6px; align-items: center; margin: 3px 0; }
.studio-res-video { width: 100%; max-height: 140px; background: #000; border-radius: 4px; }
.tk-refvid { object-fit: cover; background: #000; }
.tk-card.tk-startvid { cursor: pointer; border-style: dashed; }
.tk-card.tk-startvid .tk-thumb video { width: 100%; height: 100%; object-fit: cover; }
.tk-link.start { stroke: #8a90a0; stroke-dasharray: 5 4; }
.studio-progress { min-width: 420px; }
.studio-preview-note { margin-top: 4px; }
.studio-preview-note .studio-progress-track { margin-top: 4px; }
.studio-res-del { flex: none; padding: 0 5px; }
.studio-progress-track { height: 10px; background: #2a2f38; border-radius: 5px; overflow: hidden; margin-top: 8px; }
.studio-progress-bar { height: 100%; width: 0; background: #4f8cff; transition: width .15s; }
.tl .block.has-err::after, .tl .block.has-warn::after { content: ""; position: absolute; right: 3px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--err); }
.tl .block.has-warn:not(.has-err)::after { background: var(--warn); }
.tl .lead { position: absolute; top: 56px; height: 9px; border-radius: 2px; }
.tl .lead.ctx { background: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 2px, transparent 2px 5px); }
.tl .lead.hidden { background: repeating-linear-gradient(135deg, rgba(240,180,76,.7) 0 3px, transparent 3px 7px); }
.tl .seam { position: absolute; top: 18px; height: 38px; width: 0; z-index: 4; }
.tl .seam.cut { border-left: 2px solid #fff; }
.tl .seam.cut span { position: absolute; top: -3px; left: -6px; font-size: 10px; }
.tl .songend { position: absolute; top: 16px; bottom: 0; border-left: 2px dashed var(--err); z-index: 5; }
.tl .songend span { position: absolute; bottom: 0; left: 3px; font-size: 10px; color: var(--err); white-space: nowrap; }
.tl-legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 3px; }
.tl-legend i { display: inline-block; width: 18px; height: 8px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
.tl-empty { color: var(--muted); padding: 18px 0; }

/* body */
.body { display: grid; grid-template-columns: 230px minmax(0, 1fr) 320px; min-height: 0; }
.side, .list, .editor { overflow: auto; min-height: 0; }
.side { background: var(--panel); border-left: 1px solid var(--line); padding: 12px; }
.list { background: #191b21; border-right: 1px solid var(--line); padding: 10px 8px; }
.editor { padding: 14px 18px 60px; }
section.box { margin-bottom: 18px; }
.grid2 { display: grid; grid-template-columns: 110px 1fr; gap: 6px 8px; align-items: center; }
.grid2 input, .grid2 select { width: 100%; }
.hint { color: var(--muted); font-size: 11.5px; }
.refrow { display: grid; grid-template-columns: 1fr 22px; gap: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; background: var(--panel2); }
.refrow input.rname { font-weight: 600; }
.refrow input, .refrow textarea { width: 100%; }
.refrow textarea { font-family: inherit; font-size: 12px; min-height: 30px; }
.kinds { font-size: 11px; color: var(--muted); grid-column: 1 / 3; }
.kinds b { color: var(--accent); font-weight: 500; }
.vlist { list-style: none; padding: 0; margin: 0; }
.vlist li { padding: 4px 6px; border-radius: 4px; margin-bottom: 3px; font-size: 12px; cursor: pointer; border-left: 3px solid; background: var(--panel2); }
.vlist li.error { border-color: var(--err); }
.vlist li.warning { border-color: var(--warn); }
.vlist li .where { color: var(--muted); margin-right: 4px; }

.clipitem { display: grid; grid-template-columns: 26px 1fr auto; gap: 4px; align-items: center; padding: 6px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; }
.clipitem:hover { background: var(--panel2); }
.clipitem.sel { background: #26324a; border-color: #3d68ad; }
.clipitem .num { font-weight: 700; color: var(--muted); text-align: right; }
.clipitem .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clipitem .meta { font-size: 11px; color: var(--muted); grid-column: 2 / 4; }
.clipitem .dot { width: 8px; height: 8px; border-radius: 50%; }
.clipitem .dot.e { background: var(--err); } .clipitem .dot.w { background: var(--warn); }
.listbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }

.ed-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.ed-head .t { font-size: 17px; font-weight: 600; margin-right: 8px; }
.fields { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 8px 14px; margin-bottom: 8px; }
.fields > div { display: flex; flex-direction: column; gap: 3px; }
.fields input, .fields select { width: 100%; }
.timing { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.timing b { color: var(--text); font-weight: 500; }
.toggle { display: flex; align-items: center; gap: 6px; height: 27px; white-space: nowrap; font-size: 12.5px; }
.msgs { margin-bottom: 12px; }
.msgs div { padding: 4px 8px; border-radius: 4px; margin-bottom: 3px; font-size: 12px; }
.msgs .error { background: #3c2024; color: #ffb3b3; }
.msgs .warning { background: #3a301b; color: #f6d38f; }

        <button id="btnPlanSettings" title="mode, contexte, fondu, graine, chanson, références du plan" data-t-title="shell.plan_settings_title" data-t="shell.plan_settings">⚙ Réglages du plan</button>

        <span class="badge" id="badge"></span>
    </header>
    <div class="timeline" id="timeline"></div>
    <div class="body" id="planView">
        <nav class="list" id="list"></nav>
        <main class="editor" id="editor"></main>
        <aside class="side" id="side"></aside>

</div>

// H3 Clip Plan - plan logic (pure functions, port of core.py v6). No DOM access in this part.

            "[reference generation] ",

            H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += h;
        }
        return [...H].map((x) => x.toString(16).padStart(8, "0")).join("");
    }
    async function sha256Hex(text) {
        const bytes = new TextEncoder().encode(text);
        if (typeof crypto !== "undefined" && crypto.subtle) {
            const digest = await crypto.subtle.digest("SHA-256", bytes);
            return [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, "0")).join("");
        }
        return sha256Plain(bytes);
    }
    // Same value as core.take_fingerprint(normalize(plan), index). Needs legal frames everywhere.
    async function takeFingerprints(plan) {
        const rows = timeline(plan);
        const out = {};
        for (const row of rows) {
            const clip = expandedClip(plan, plan.clips[row.index - 1]);
            const payload = {
                frames: clip.frames, continue: !!clip.continue, refs: [...(clip.refs || [])], prompt: clip.prompt,
                raw_start: row.raw_start, context: row.context, mode: mode(plan),
            };
            const sv = startVideo(plan);   // same as core._start_video_payload
            const ev = editVideo(plan);
            if (ev) { if (editSlice(plan, row.index)) payload.edit_video = [ev.ref, ev.start_frame]; }
            else if (sv) {
                if (row.index === 1 && plan.clips[0].continue) payload.start_video = [sv.ref, sv.start_frame, sv.end_frame];
                if (mode(plan) === "music_video") payload.song_offset = songOffset(plan);
            }
            out[row.index] = (await sha256Hex(pyDumps(payload))).slice(0, 16);
        }
        return out;
    }

    // Port of core.resolve_takes. takes: {index: [record]} (record.id set), fingerprints: {index: fp}.
    function resolveTakes(plan, takes, selection, fingerprints) {
        selection = selection || {};
        const everything = Object.values(takes).flat();
        const currentRefs = new Map();
        let currentSize = null;
        for (const r of [...everything].sort((a, b) => (a.saved_at || 0) - (b.saved_at || 0))) {
            for (const [name, kinds] of Object.entries(r.refs || {})) {
                for (const kind of ["image", "voice", "video"]) currentRefs.set(`${name}\u0000${kind}`, (kinds || {})[kind] ?? null);
            }
            currentSize = [r.width, r.height];
        }
        const result = {};
        (plan.clips || []).forEach((clip, k) => {
            const index = k + 1;
            const previous = result[index - 1];
            const living = new Set(previous ? Object.entries(previous.takes).filter(([, s]) => s[0] !== "stale").map(([id]) => id) : []);
            const states = {}, kinds = {};
            const existingParents = new Set((takes[index - 1] || []).map((r) => r.id));
            const list = [...(takes[index] || [])].sort((a, b) => (a.saved_at || 0) - (b.saved_at || 0));
            for (const r of list) {
                let reason = null, kind = null;
                if (r.frames !== clip.frames || r.fingerprint !== fingerprints[index]) { reason = _t("check.its_entry_in_the_plan_has"); kind = "plan"; }
                else if (!currentSize || r.width !== currentSize[0] || r.height !== currentSize[1]) {
                    reason = _t("check.made_at_x_the_latest_at", { width: r.width, height: r.height, v2: currentSize ? currentSize.join("x") : "?" });
                    kind = "size";
                } else {
                    outer: for (const name of Object.keys(r.refs || {}).sort()) {
                        for (const kind of ["image", "voice", "video"]) {
                            const mine = (r.refs[name] || {})[kind] ?? null;
                            if (mine !== (currentRefs.get(`${name}\u0000${kind}`) ?? null)) {
                                reason = _t("check.of_has_changed_since", { v0: kind === "image" ? _t("check.the_picture") : _t("check.the_voice"), name });
                                break outer;
                            }
                        }
                    }
                }
                if (reason) { states[r.id] = ["stale", reason]; kinds[r.id] = kind || "refs"; }
                else if (clip.continue && index > 1) {
                    if (!living.has(r.parent)) {
                        const exists = existingParents.has(r.parent);
                        states[r.id] = ["stale", exists ? _t("check.the_take_of_clip_it_continues", { v0: index - 1 }) : _t("check.the_take_of_clip_it_continues_2", { v0: index - 1 })];
                        kinds[r.id] = exists ? "parent_stale" : "parent_missing";
                    }
                    else if (r.parent !== previous.chosen) states[r.id] = ["other", _t("check.continues_take_of_clip", { parent: r.parent, v1: index - 1 })];
                    else states[r.id] = ["ok", ""];
                } else states[r.id] = ["ok", ""];
            }
            const usable = Object.entries(states).filter(([, s]) => s[0] === "ok").map(([id]) => id);
            const wanted = selection[index];
            const chosen = usable.includes(wanted) ? wanted : (usable.length ? usable[usable.length - 1] : null);
            result[index] = { chosen, takes: states, kinds };
        });
        return result;
    }
    // the branch of a take (record.studio.branch)
    function takeBranch(r, def) { return (r.studio && r.studio.branch) || def || null; }
    function usablePrefix(plan, resolved) {
        let count = 0;
        for (let i = 1; i <= (plan.clips || []).length; i++) { if (!resolved[i] || !resolved[i].chosen) break; count = i; }
        return count;
    }

    return {
        FPS, MAX_CLIPS, SOFT_MAX_FRAMES, DEFAULT_CONTEXT, DEFAULT_FEATHER, SECTIONS, NAME_RE, MODES,
        CONTINUE_SENTENCE, FREE_CONTINUE_SUFFIX, HIDDEN_LEADIN_FREE, HIDDEN_LEADIN_MUSIC,
        isRun, largestRun, isAvBoundary, avContextValues, mode, placeholders, timeline, framesLegal, validate,
        PLAN_VERSION, startVideo, startRow, finalStart, songOffset, pyRound, editVideo, editSlice, editCuts, EDIT_MAX_FRAMES, EDIT_MARK, expandEdit, expandedClip, editClipCount,
        parseSections, composeSections, skeleton, renameRef, referenceKinds, contextOf, squash,
        pyDumps, takeFingerprints, resolveTakes, takeBranch, usablePrefix, sha256Plain,
    };
})();

<script>
// In-app dialogs replacing the browser's alert / confirm / prompt (same look as the rest of the app).
// H3Dialog.alert(text) -> Promise<void> ; H3Dialog.confirm(text, opts) -> Promise<boolean> ;
// H3Dialog.prompt(text, value, opts) -> Promise<string|null>. window.alert is redirected here
// (alerts never needed to block); confirm and prompt are awaited at their call sites.
const H3Dialog = (() => {
    const DANGER = /supprim|restaur|écraser|arrêter|annuler|interrompre|remplacer|perdues|invalidées|retirer/i;
    function open(text, { input = null, cancel = true, ok = "OK", no: noLabel = _t("dialog.cancel"), danger = false, check = null } = {}) {
        return new Promise((resolve) => {
            const prev = document.activeElement;
            const overlay = document.createElement("div");
            overlay.className = "h3-dlg";
            const box = document.createElement("div");
            box.className = "h3-dlg-box";
            box.setAttribute("role", "dialog");
            const msg = document.createElement("div");
            msg.className = "h3-dlg-text";
            msg.textContent = String(text ?? "");
            box.append(msg);
            let field = null;
            if (input !== null) {
                field = document.createElement("input");
                field.className = "h3-dlg-input";
                field.value = input;
                box.append(field);
            }
            let box2 = null;
            if (check) {
                const label = document.createElement("label");
                label.className = "h3-dlg-check";
                box2 = document.createElement("input");
                box2.type = "checkbox";
                box2.checked = !!check.checked;
                label.append(box2, document.createTextNode(" " + check.label));
                box.append(label);
            }
            const row = document.createElement("div");
            row.className = "h3-dlg-buttons";
            const okBtn = document.createElement("button");
            okBtn.textContent = ok;
            okBtn.className = danger ? "danger-fill" : "primary";
            let cancelBtn = null;
            if (cancel) {
                cancelBtn = document.createElement("button");
                cancelBtn.textContent = noLabel;
                row.append(cancelBtn);
            }
            row.append(okBtn);
            box.append(row);
            overlay.append(box);
            const done = (value) => {
                document.removeEventListener("keydown", onKey, true);
                overlay.remove();
                try { prev && prev.focus && prev.focus(); } catch (_) { /* ignore */ }
                resolve(value);
            };
            const yes = () => done(field ? field.value : box2 ? { checked: box2.checked } : true);
            const no = () => done(field ? null : (cancel ? false : undefined));
            const onKey = (e) => {
                if (!document.body.contains(overlay) || overlay !== [...document.querySelectorAll(".h3-dlg")].pop()) return;
                if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); no(); }
                else if (e.key === "Enter" && !(e.target && e.target.tagName === "BUTTON" && e.target !== okBtn)) { e.preventDefault(); e.stopPropagation(); yes(); }
            };
            okBtn.onclick = yes;
            if (cancelBtn) cancelBtn.onclick = no;
            overlay.addEventListener("mousedown", (e) => { if (e.target === overlay && cancel) no(); });
            document.addEventListener("keydown", onKey, true);
            document.body.append(overlay);
            if (field) { field.focus(); field.select(); } else (danger && cancelBtn ? cancelBtn : okBtn).focus();
        });
    }
    return {
        alert: (text) => open(text, { cancel: false }),
        confirm: (text, opts = {}) => open(text, { ok: opts.ok || _t("dialog.yes"), no: opts.no || _t("dialog.no"), danger: opts.danger ?? DANGER.test(String(text)), check: opts.check || null }),
        prompt: (text, value = "", opts = {}) => open(text, { input: value ?? "", ok: opts.ok || "OK" }),
    };
})();
window.H3Dialog = H3Dialog;
window.alert = (text) => { H3Dialog.alert(text); };

</script>
<script>
// ---------------------------------------------------------------------------------------------
// H3Pick: every long drop-down list of the app (LoRA, models…) opens with a filter field.
// The native <select> stays where it is (layout, value, onchange unchanged): a click or a key on it
// opens a filtered list under it instead of the browser's own list.
// ---------------------------------------------------------------------------------------------
const H3Pick = (() => {
    const MIN_OPTIONS = 8;          // shorter lists keep the browser's list
    let pop = null;

    const eligible = (sel) => sel && sel.tagName === "SELECT" && !sel.multiple && !sel.disabled
        && sel.dataset.nopick === undefined && sel.options.length >= MIN_OPTIONS;

    function close() {
        if (!pop) return;
        const { sel, node } = pop;
        pop = null;
        node.remove();
        window.removeEventListener("resize", close);
        document.removeEventListener("scroll", onScroll, true);
        if (sel.isConnected) sel.focus();
    }
    function onScroll(e) { if (pop && !pop.node.contains(e.target)) close(); }

    function choose(sel, option) {
        if (option.disabled) return;
        const changedValue = sel.value !== option.value;
        sel.value = option.value;
        close();
        if (changedValue) {
            sel.dispatchEvent(new Event("input", { bubbles: true }));
            sel.dispatchEvent(new Event("change", { bubbles: true }));
        }
    }

    function open(sel, typed = "") {
        close();
        const node = document.createElement("div");
        node.className = "h3-pick-pop";
        const input = document.createElement("input");
        input.className = "h3-pick-filter";
        input.placeholder = "filtrer…";
        input.value = typed;
        const count = document.createElement("span");
        count.className = "h3-pick-count";
        const head = document.createElement("div");
        head.className = "h3-pick-head";
        head.append(input, count);
        const list = document.createElement("div");
        list.className = "h3-pick-list";
        list.setAttribute("role", "listbox");
        node.append(head, list);
        document.body.append(node);

        const all = [...sel.options].map((o) => ({ o, text: o.textContent, group: o.parentElement.tagName === "OPTGROUP" ? o.parentElement.label : "" }));
        let shown = [], active = 0;
        const draw = () => {
            const terms = input.value.toLowerCase().split(/\s+/).filter(Boolean);
            shown = all.filter((x) => !terms.length || terms.every((t) => (x.text + " " + x.o.value).toLowerCase().includes(t)));
            const current = shown.findIndex((x) => x.o.selected);
            active = Math.max(0, Math.min(active, shown.length - 1));
            if (!input.dataset.moved) active = current >= 0 && !terms.length ? current : 0;
            list.replaceChildren();
            let lastGroup = null;
            shown.forEach((x, i) => {
                if (x.group && x.group !== lastGroup) {
                    const g = document.createElement("div");
                    g.className = "h3-pick-group";
                    g.textContent = x.group;
                    list.append(g);
                }
                lastGroup = x.group;
                const item = document.createElement("div");
                item.className = "h3-pick-item" + (i === active ? " on" : "") + (x.o.selected ? " sel" : "") + (x.o.disabled ? " off" : "");
                item.setAttribute("role", "option");
                item.textContent = x.text || " ";
                item.title = x.text;
                item.addEventListener("mousedown", (e) => { e.preventDefault(); choose(sel, x.o); });
                item.addEventListener("mousemove", () => { if (active !== i) { active = i; input.dataset.moved = "1"; mark(); } });
                list.append(item);
            });
            count.textContent = terms.length ? `${shown.length} / ${all.length}` : `${all.length}`;
            if (!shown.length) {
                const none = document.createElement("div");
                none.className = "h3-pick-none";
                none.textContent = _t("pick.no_results");
                list.append(none);
            }
            mark(true);
        };
        const mark = (scroll) => {
            const items = list.querySelectorAll(".h3-pick-item");
            items.forEach((el, i) => el.classList.toggle("on", i === active));
            if (scroll && items[active]) items[active].scrollIntoView({ block: "nearest" });
        };
        input.addEventListener("input", () => { delete input.dataset.moved; active = 0; draw(); });
        input.addEventListener("keydown", (e) => {
            if (e.key === "ArrowDown") { e.preventDefault(); input.dataset.moved = "1"; active = Math.min(active + 1, shown.length - 1); mark(true); }
            else if (e.key === "ArrowUp") { e.preventDefault(); input.dataset.moved = "1"; active = Math.max(active - 1, 0); mark(true); }
            else if (e.key === "PageDown") { e.preventDefault(); input.dataset.moved = "1"; active = Math.min(active + 10, shown.length - 1); mark(true); }
            else if (e.key === "PageUp") { e.preventDefault(); input.dataset.moved = "1"; active = Math.max(active - 10, 0); mark(true); }
            else if (e.key === "Enter") { e.preventDefault(); if (shown[active]) choose(sel, shown[active].o); }
            else if (e.key === "Escape" || e.key === "Tab") { e.preventDefault(); close(); }
        });

        // place it under the select (or above it when there is no room below)
        const r = sel.getBoundingClientRect();
        const width = Math.min(Math.max(r.width, 280), 560, window.innerWidth - 16);
        node.style.width = width + "px";
        node.style.left = Math.max(8, Math.min(r.left, window.innerWidth - width - 8)) + "px";
        const below = window.innerHeight - r.bottom - 10, above = r.top - 10;
        const maxH = Math.max(160, Math.min(380, Math.max(below, above)));
        list.style.maxHeight = (maxH - 40) + "px";
        if (below >= Math.min(maxH, 260) || below >= above) node.style.top = (r.bottom + 2) + "px";
        else node.style.bottom = (window.innerHeight - r.top + 2) + "px";

        pop = { sel, node };
        draw();
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
        window.addEventListener("resize", close);
        document.addEventListener("scroll", onScroll, true);
    }

    document.addEventListener("mousedown", (e) => {
        if (pop && !pop.node.contains(e.target)) {
            const same = e.target === pop.sel;
            close();
            if (same) { e.preventDefault(); return; }
        }
        const sel = e.target.closest && e.target.closest("select");
        if (!eligible(sel) || e.button !== 0) return;
        e.preventDefault();
        sel.focus();
        open(sel);
    }, true);
    document.addEventListener("keydown", (e) => {
        const sel = e.target;
        if (pop || !eligible(sel) || e.ctrlKey || e.metaKey) return;
        const opener = e.key === "Enter" || e.key === " " || e.key === "F4" || (e.altKey && e.key === "ArrowDown");
        const printable = e.key.length === 1 && e.key !== " " && !e.altKey;
        if (!opener && !printable) return;
        e.preventDefault();
        open(sel, printable ? e.key : "");
    }, true);

    return { open, close, MIN_OPTIONS };
})();

</script>
<script>
// ---------------------------------------------------------------------------------------------
// H3Sections: the "Sections" editor of a clip prompt (Plan tab).
// The prompt stays the reference (it is what H3 receives and what takes are checked against).
// In the editor, <Subject N> is shown as @name: the names live in clip._subjects (ignored by the
// nodes) and the numbers are recomputed when the prompt is written back.
// ---------------------------------------------------------------------------------------------
const H3Sections = (() => {
    const _t = typeof H3I18n !== "undefined" ? H3I18n.t : (id) => id;
    const NAME_CHARS = "[A-Za-z0-9][A-Za-z0-9_-]*";
    const NAME_OK = new RegExp(`^${NAME_CHARS}$`);
    const PREFIX = "[reference generation]";
    const MODES = ["fully_preserved", "partially_preserved", "attribute_transfer"];
    const RET_RE = new RegExp(`^@(${NAME_CHARS})\\s*(\\([^)]*\\))?\\s*:\\s*(${MODES.join("|")})\\s*(?:-\\s?)?(.*)$`);

    // ------------------------------------------------------------------ pure helpers (tested in node)
    function cleanName(s) {
        const v = String(s || "").replace(/[^A-Za-z0-9_-]/g, "_").replace(/^[_-]+/, "");
        return v || "subject";
    }
    function maxSubject(text) {
        let m = 0;
        for (const x of String(text || "").matchAll(/<Subject (\d+)>/g)) m = Math.max(m, +x[1]);
        return m;
    }
    // names of <Subject 1..N>: clip._subjects first, then a name taken from the subject's line
    function subjectNames(clip, parts) {
        const given = Array.isArray(clip._subjects) ? clip._subjects.map(cleanName) : [];
        const n = Math.max(given.length, maxSubject(clip.prompt));
        const sec0 = parts ? parts[0] : String(clip.prompt || "");
        const names = [];
        for (let k = 1; k <= n; k++) {
            let name = given[k - 1];
            if (!name) {
                const lines = sec0.split("\n").filter((l) => l.trim().startsWith(`<Subject ${k}>`)).join("\n");
                const m = new RegExp(`\\{(?:picture|voice):(${NAME_CHARS})\\}`).exec(lines);
                name = m ? m[1] : `s${k}`;
            }
            let unique = name, j = 2;
            while (names.includes(unique)) unique = `${name}_${j++}`;
            names.push(unique);
        }
        return names;
    }
    const toDisplay = (text, names) => String(text || "").replace(/<Subject (\d+)>/g, (m, k) => (names[k - 1] ? "@" + names[k - 1] : m));
    const toPrompt = (text, names) => String(text || "").replace(new RegExp(`@(${NAME_CHARS})`, "g"), (m, n) => {
        const i = names.indexOf(n);
        return i < 0 ? m : `<Subject ${i + 1}>`;
    });
    const unknownMentions = (display, names) => [...new Set([...String(display || "").matchAll(new RegExp(`@(${NAME_CHARS})`, "g"))]
        .map((m) => m[1]).filter((n) => !names.includes(n)))];

    // subject_definitions (display form): the lines of each subject, and the lines of nobody
    function parseSubjects(display, names) {
        const rows = names.map((name) => ({ name, lines: [] }));
        const extra = [];
        for (const line of String(display || "").split("\n")) {
            const t = line.trim();
            if (!t) continue;
            const m = new RegExp(`^@(${NAME_CHARS})(?:\\s+([\\s\\S]*))?$`).exec(t);
            const i = m ? names.indexOf(m[1]) : -1;
            if (i >= 0) rows[i].lines.push(m[2] || "");
            else extra.push(t);
        }
        return { rows: rows.map((r) => ({ name: r.name, text: r.lines.join("\n") })), extra: extra.join("\n") };
    }
    function composeSubjects(rows, extra) {
        const out = [];
        for (const r of rows) for (const l of String(r.text || "").split("\n").map((s) => s.trim()).filter(Boolean)) out.push(`@${r.name} ${l}`);
        if (String(extra || "").trim()) out.push(String(extra).trim());
        return out.join("\n");
    }
    // retention_analysis (display form): one row per line, or null when a line has another shape
    function parseRetention(display) {
        const rows = [];
        for (const line of String(display || "").split("\n")) {
            const t = line.trim();
            if (!t) continue;
            const m = RET_RE.exec(t);
            if (!m) return null;
            rows.push({ name: m[1], scope: m[2] || "", mode: m[3], why: m[4] || "" });
        }
        return rows;
    }
    const composeRetention = (rows) => rows.map((r) => `@${r.name}${r.scope ? " " + r.scope : ""}: ${r.mode} - ${String(r.why || "").trim()}`.replace(/\s+$/, "")).join("\n");
    const retentionLine = (name) => ({ name, scope: "(appears throughout [Shot 1])", mode: "fully_preserved", why: "" });

    function splitSummary(display) {
        const m = /^\[reference generation\]\s*/.exec(String(display || ""));
        return m ? { had: true, text: display.slice(m[0].length) } : { had: false, text: String(display || "") };
    }
    const composeSummary = (text) => `${PREFIX} ${String(text || "").trim()}`.trim();

    function sentences() {
        return [H3.CONTINUE_SENTENCE + H3.FREE_CONTINUE_SUFFIX, H3.CONTINUE_SENTENCE, H3.HIDDEN_LEADIN_FREE, H3.HIDDEN_LEADIN_MUSIC];
    }
    // the sentence a clip must open with: continuation, hidden lead-in of a new scene, or none (first clip)
    // afterVideo: the plan starts from a video, so clip 1 follows it like any other clip
    function expectedSentence(clip, index, free, afterVideo = false) {
        if (clip.continue) return H3.CONTINUE_SENTENCE + (free ? H3.FREE_CONTINUE_SUFFIX : "");
        if (index > 1 || afterVideo) return free ? H3.HIDDEN_LEADIN_FREE : H3.HIDDEN_LEADIN_MUSIC;
        return "";
    }
    function parseDetailed(display) {
        const pieces = String(display || "").split(/\[Shot \d+\]/);
        const style = pieces[0].trim();
        const shots = pieces.slice(1).map((s) => s.trim());
        let found = "";
        if (shots.length) {
            for (const s of sentences()) if (shots[0].startsWith(s)) { found = s; shots[0] = shots[0].slice(s.length).trim(); break; }
        }
        return { style, shots, found };
    }
    // an opening sentence written by hand (an LLM plan often words it its own way): kept as it is
    function customOpening(det) {
        if (det.found || !det.shots.length) return false;
        const first = det.shots[0].split(/(?<=[.;])\s/)[0] || "";
        return /continues? uninterrupted|lead-in|already fully established/i.test(first);
    }
    // the sentence written back before [Shot 1] after an ordinary edit: the one already there, as it is. Only the
    // « use the right sentence » button puts the expected one: changing it would change the prompt, so invalidate
    // the takes, on an edit somewhere else in the section.
    const openingFor = (det) => (customOpening(det) ? "" : det.found);
    function composeDetailed(style, shots, auto) {
        const list = shots.length ? shots : auto ? [""] : [];
        let out = String(style || "").trim();
        list.forEach((b, i) => {
            const body = String(b || "").trim();
            const text = i === 0 && auto ? auto + (body ? " " + body : "") : body;
            out += (out ? "\n" : "") + `[Shot ${i + 1}] ` + text;
        });
        return out.replace(/\s+$/, "");
    }
    // <Subject k> → map(k) everywhere (a number, or a string put instead)
    const remapSubjects = (text, map) => String(text || "").replace(/<Subject (\d+)>/g, (m, k) => {
        const r = map(+k);

<script>

            else if (k === "checked") node.checked = !!v;
            else if (k === "selected") node.selected = !!v;
            else if (k === "html") node.innerHTML = v;

// Encore - projects, imports, references and settings on top of the plan editor.

<script>

(() => {

        return node;

    const after = (res) => { if (res && res.project) K().applyProject(res.project); if (tk()) tk().rescan(); };

    // 🗑 on a take: says what goes with it, then moves it to the trash
    async function deleteTake(index, takeId) {
        try {
            const url = `${K().base()}/takes/delete`;
            const plan = await K().post(url, { take: takeId });
            const byClip = {};
            for (const [i, id] of plan.takes || []) if (id !== takeId) (byClip[i] = byClip[i] || []).push(short(id));
            const others = Object.entries(byClip).map(([i, ids]) => _t("trash.clip_takes", { index: i, takes: ids.join(", ") }));
            const bases = Object.entries(plan.bases || {}).map(([name, k]) => k ? _t("trash.base_kept", { name, k }) : _t("trash.base_none", { name }));
            const msg = [_t("trash.delete_take", { index, take: short(takeId) }),
                others.length ? _t("trash.with") + "\n• " + others.join("\n• ") : _t("trash.alone"),
                bases.length ? bases.join("\n") : null, _t("trash.to_trash")].filter(Boolean).join("\n\n");
            if (!await H3Dialog.confirm(msg)) return;
            await K().saveIfDirty();
            after(await K().post(url, { take: takeId, confirm: true }));
            K().toast(_t("trash.moved", { count: plan.count }));
        } catch (e) { alert(e.message); }
    }

    // the trash: restore an entry (with what it holds), erase it, or empty the trash
    async function open() {
        const body = h("div", { class: "trash-list" });
        const when = (t) => new Date(t * 1000).toLocaleString(H3I18n.lang() === "fr" ? "fr-FR" : "en-GB", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        const draw = async () => {
            let data;
            try { data = await K().api(`${K().base()}/trash`); } catch (e) { K().fill(body, h("p", { class: "hint" }, e.message)); return; }
            const entries = data.entries || [];
            K().fill(body,
                h("p", { class: "hint" }, _t("trash.hint")),
                entries.length ? entries.map((e) => h("div", { class: "trash-row" },
                    h("span", { class: "trash-kind" }, e.kind === "branch" ? "⎇" : "▭"),
                    h("div", { class: "trash-what" }, h("b", {}, e.label), h("div", { class: "hint" }, when(e.when)
                        + (e.videos ? " · " + _t("trash.videos", { count: e.videos }) : ""))),
                    h("button", { class: "small primary", onclick: async () => {
                        try { after(await K().post(`${K().base()}/trash/${encodeURIComponent(e.id)}/restore`, {})); K().toast(_t("trash.restored")); } catch (err) { alert(err.message); }
                        draw();
                    } }, _t("trash.restore")),
                    h("button", { class: "small danger", onclick: async () => {
                        if (!await H3Dialog.confirm(_t("trash.erase_confirm", { label: e.label }))) return;
                        try { await K().api(`${K().base()}/trash/${encodeURIComponent(e.id)}`, { method: "DELETE" }); } catch (err) { alert(err.message); }
                        draw();
                    } }, _t("trash.erase"))))
                    : h("p", { class: "hint" }, _t("trash.empty")),
                entries.length ? h("div", { class: "tk-inline", style: "justify-content:flex-end;margin-top:10px" },
                    h("button", { class: "danger", onclick: async () => {
                        if (!await H3Dialog.confirm(_t("trash.empty_confirm", { count: entries.length }))) return;
                        try { await K().api(`${K().base()}/trash`, { method: "DELETE" }); } catch (err) { alert(err.message); }
                        draw();
                    } }, _t("trash.empty_all"))) : null);
        };
        draw();
        K().modal(_t("trash.title"), body, { wide: true });
    }

    window.H3Trash = { deleteTake, open };
})();

</script>
</body>
</html>
